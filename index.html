<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0B0C" />

    <!-- Favicon (shown next to the result on Google) -->
    <link rel="icon" type="image/png" href="/wcg-logo.png" />
    <link rel="apple-touch-icon" href="/wcg-logo.png" />

    <!-- Primary SEO -->
    <title>WCG — Roofing &amp; Restoration Contractor, DFW metroplex</title>
    <meta
      name="description"
      content="WCG is a Dallas–Fort Worth turn-key roofing and restoration contractor. We build, repair and handle full insurance-claim roofs across the DFW metroplex — from inspection to final sign-off."
    />
    <link rel="canonical" href="https://wisecogroup.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Open Graph (Facebook, LinkedIn, iMessage previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WCG" />
    <meta property="og:title" content="WCG — Roofing &amp; Restoration Contractor, DFW metroplex" />
    <meta
      property="og:description"
      content="Dallas–Fort Worth turn-key roofing and restoration. We build, repair and handle full insurance-claim roofs across the DFW metroplex."
    />
    <meta property="og:url" content="https://wisecogroup.com/" />
    <meta property="og:image" content="https://wisecogroup.com/wcg-logo.png" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="WCG — Roofing &amp; Restoration Contractor, DFW metroplex" />
    <meta
      name="twitter:description"
      content="Dallas–Fort Worth turn-key roofing and restoration. Build, repair and full insurance-claim work across the DFW metroplex."
    />
    <meta name="twitter:image" content="https://wisecogroup.com/wcg-logo.png" />

    <!-- Structured data: lets Google show the name, logo and business info -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "RoofingContractor",
        "name": "WCG",
        "alternateName": "Wise Construction Group",
        "url": "https://wisecogroup.com/",
        "logo": "https://wisecogroup.com/wcg-logo.png",
        "image": "https://wisecogroup.com/wcg-logo.png",
        "description": "WCG is a Dallas–Fort Worth turn-key roofing and restoration general contractor. We build, repair and execute all insurance-claim work from initial inspection to final completion.",
        "telephone": "+1-214-500-7360",
        "email": "vini@wisecogroup.com",
        "priceRange": "$$",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Flower Mound",
          "addressRegion": "TX",
          "postalCode": "75028",
          "addressCountry": "US"
        },
        "areaServed": {
          "@type": "AdministrativeArea",
          "name": "Dallas–Fort Worth metroplex"
        },
        "openingHours": "Mo-Sa 07:00-19:00",
        "sameAs": [
          "https://www.facebook.com/wisecg",
          "https://www.instagram.com/wisecotx/",
          "https://www.youtube.com/@wisecontx"
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
